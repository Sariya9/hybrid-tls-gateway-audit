global
    nbthread 1
    maxconn 2
    log stdout format raw local0 info
    stats socket unix@admin.sock level admin
defaults
    log global
    mode tcp
    timeout connect 2s
    timeout client 4s
    timeout server 4s
    retries 0
    log-format "case=H05 fc=%[ssl_fc_curve] bc=%[ssl_bc_curve] fp=%[ssl_fc_protocol] bp=%[ssl_bc_protocol] fr=%[ssl_fc_is_resumed] br=%[ssl_bc_is_resumed] fe=%[ssl_fc_err] be=%[ssl_bc_err] bcname=%[bc_err_name] sni=%[ssl_bc_sni] cert=%[ssl_s_der,sha2(256),hex] term=%ts bytes=%B"
    error-log-format "case=H05 fc=%[ssl_fc_curve] bc=- fp=%[ssl_fc_protocol] bp=- fr=%[ssl_fc_is_resumed] br=- fe=%[ssl_fc_err] be=- bcname=- sni=- cert=- term=frontend_error bytes=0"
frontend f
    bind 127.0.0.1:56402 ssl crt proxy.pem curves X25519 ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 no-tls-tickets
    default_backend b
backend b
    server origin 127.0.0.1:56401 ssl verify required ca-file origin-ca.crt verifyhost origin.test curves X25519MLKEM768 ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 no-ssl-reuse
