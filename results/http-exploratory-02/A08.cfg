global
    nbthread 1
    maxconn 32
    log stdout format raw local0 info
    stats socket unix@admin.sock level admin
defaults
    mode http
    log global
    timeout connect 2s
    timeout client 5s
    timeout server 5s
    timeout http-keep-alive 5s
    retries 0
    option http-keep-alive
    log-format "AUDIT id=%[var(txn.audit_id)] path=%[var(txn.audit_path)] cp=%cp fc=%[ssl_fc_curve] bc=%[ssl_bc_curve] fp=%[ssl_fc_protocol] bp=%[ssl_bc_protocol] fr=%[ssl_fc_is_resumed] br=%[ssl_bc_is_resumed] cert=%[ssl_s_der,sha2(256),hex] backend=%b status=%ST term=%ts"
frontend front
    bind 127.0.0.1:50592 ssl crt proxy.pem curves X25519MLKEM768:X25519 ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 no-tls-tickets alpn http/1.1
    http-request set-var(txn.audit_id) req.hdr(X-Audit-ID)
    http-request set-var(txn.audit_path) path
    acl protected path -m str /restricted
    acl front_hybrid ssl_fc_curve -m str X25519MLKEM768
    http-request deny deny_status 403 if !front_hybrid
    use_backend restricted if protected
    default_backend legacy
backend legacy
    http-reuse always
    server origin 127.0.0.1:50590 ssl verify required ca-file origin-ca.crt verifyhost origin.test curves X25519MLKEM768 ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 no-ssl-reuse no-sni-auto
backend restricted
    http-reuse always
    server origin 127.0.0.1:50591 ssl verify required ca-file origin-ca.crt verifyhost origin.test curves X25519MLKEM768 ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3 no-ssl-reuse no-sni-auto
